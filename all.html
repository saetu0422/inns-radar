<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INNS 과제 레이더 · 전체 공고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same tokens as index.html; filter bar on top, then one table of every checked announcement */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #5b6b78;
  --line: #d9e0e6;
  --accent: #0f5c7a;
  --accent-soft: #e2eef3;
  --urgent: #b4321f;
  --urgent-soft: #fbe7e3;
  --ok: #1d6b45;
  --ok-soft: #e1f2e8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f161c; --surface: #16212a; --ink: #e4ebf0; --muted: #93a4b1; --line: #2a3a46;
    --accent: #6cc0e0; --accent-soft: #173342; --urgent: #ff8a75; --urgent-soft: #3a1d18;
    --ok: #7fd3a4; --ok-soft: #15301f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav a { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: 14px; }
.nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.nav a:hover, .nav a:focus-visible { border-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-block: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 14px; padding: 6px 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#q { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 200px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.t a { color: var(--ink); text-decoration: none; }
td.t a:hover, td.t a:focus-visible { color: var(--accent); text-decoration: underline; }
td.t .org { display: block; font-size: 12.5px; color: var(--muted); }
td.d { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.pill.rel { background: var(--ok-soft); color: var(--ok); }
.pill.unrel { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.st { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.dday { display: inline-block; margin-left: 6px; font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.dday.soon { background: var(--urgent-soft); color: var(--urgent); }
.dday.past { background: var(--line); color: var(--muted); }
.empty { padding: 24px; color: var(--muted); }
footer { font-size: 12.5px; color: var(--muted); }
@media (max-width: 640px) { th.hide-sm, td.hide-sm { display: none; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">IRIS 접수중 · 접수예정 전체</div>
    <h1>전체 공고</h1>
    <p class="sub">매일 아침 확인한 IRIS 공고 전체입니다. 리포트에 정리된 공고는 '관련있음', 나머지는 '관련없음'으로 표시됩니다. 놓친 공고가 없는지 직접 훑어볼 때 쓰세요.</p>
    <nav class="nav"><a href="./">연구실 맞춤 리포트</a><a href="all.html" aria-current="page">전체 공고</a></nav>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="관련 여부">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="rel" aria-pressed="false">관련있음</button>
      <button type="button" data-f="unrel" aria-pressed="false">관련없음</button>
    </div>
    <input id="q" type="search" placeholder="공고명·부처·기관 검색" aria-label="공고 검색">
    <span class="count" id="count">불러오는 중</span>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>구분</th><th>공고명</th><th class="hide-sm">상태</th><th class="hide-sm">공고일</th><th>마감</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer id="foot">D-day는 오늘(한국 시간) 기준입니다.</footer>
</div>
<script>
(function () {
  var rows = document.getElementById("rows");
  var items = [], filter = "all", query = "";
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function todayKST() { var d = new Date(Date.now() + 9 * 3600 * 1000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  function parseDay(s) { var m = /^(\d{4})[-.](\d{1,2})[-.](\d{1,2})/.exec(s || ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
  function render() {
    rows.textContent = "";
    var today = todayKST();
    var shown = items.filter(function (x) {
      if (filter === "rel" && !x.related) return false;
      if (filter === "unrel" && x.related) return false;
      if (query) { var s = (x.title + " " + x.ministry + " " + x.agency).toLowerCase(); if (s.indexOf(query) < 0) return false; }
      return true;
    });
    var nRel = items.filter(function (x) { return x.related; }).length;
    document.getElementById("count").textContent = shown.length + "건 표시 · 전체 " + items.length + "건 (관련있음 " + nRel + " / 관련없음 " + (items.length - nRel) + ")";
    if (!shown.length) { var tr = el("tr"), td = el("td", "empty", "조건에 맞는 공고가 없습니다."); td.colSpan = 5; tr.appendChild(td); rows.appendChild(tr); return; }
    shown.forEach(function (x) {
      var tr = el("tr");
      var c1 = el("td"); c1.appendChild(el("span", "pill " + (x.related ? "rel" : "unrel"), x.related ? "관련있음" : "관련없음")); tr.appendChild(c1);
      var c2 = el("td", "t"); var a = el("a", null, x.title); a.href = x.related ? "./#iris-" + x.ancmId : x.url; if (!x.related) { a.target = "_blank"; a.rel = "noopener"; }
      c2.appendChild(a); c2.appendChild(el("span", "org", [x.ministry, x.agency, x.type].filter(Boolean).join(" · "))); tr.appendChild(c2);
      var c3 = el("td", "hide-sm"); c3.appendChild(el("span", "pill st", x.status)); tr.appendChild(c3);
      tr.appendChild(el("td", "d hide-sm", x.ancmDate || "–"));
      var c5 = el("td", "d", x.deadline || "–"); var d = parseDay(x.deadline);
      if (d != null && !/^9999/.test(x.deadline)) { var n = Math.round((d - today) / 86400000); c5.appendChild(el("span", "dday" + (n < 0 ? " past" : n <= 7 ? " soon" : ""), n < 0 ? "마감" : n === 0 ? "D-Day" : "D-" + n)); }
      tr.appendChild(c5);
      rows.appendChild(tr);
    });
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-f");
      document.querySelectorAll(".seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      render();
    });
  });
  document.getElementById("q").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); render(); });
  fetch("all.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      items = d.items || [];
      document.getElementById("foot").textContent = "마지막 확인 " + (d.checkedOn || "–") + " · D-day는 오늘(한국 시간) 기준입니다. '관련있음' 공고명을 누르면 리포트의 상세 분석으로, '관련없음' 공고명은 IRIS 원문으로 이동합니다.";
      render();
    })
    .catch(function () { document.getElementById("count").textContent = "불러오기 실패"; });
})();
</script>
</body>
</html>
